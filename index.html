<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Chat - إكرام</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #FFF0F5; color: #333; text-align: center; padding: 20px; margin: 0; }
        .header { background: #FFB6C1; padding: 15px; border-radius: 20px; margin-bottom: 20px; color: white; }
        .card { background: white; border-radius: 30px; padding: 20px; box-shadow: 0 4px 15px rgba(255,182,193,0.5); max-width: 400px; margin: auto; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; background: #FFB6C1; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 50px; }
        button { background: #FF69B4; color: white; border: none; padding: 12px 24px; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .chat-box { background: #f9f9f9; border-radius: 15px; padding: 15px; margin-top: 20px; min-height: 80px; text-align: right; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Learn Chat - تعلم وتحدث</h2>
    </div>
    <div class="card">
        <div class="avatar">👩‍🏫</div>
        <h2>إكرام</h2>
        <p>معلمتك الذكية</p>
        <button onclick="document.getElementById('chat').innerHTML = 'مرحباً بك! أنا إكرام، معلمتك. هل أنت مستعد لتعلم الإنجليزية؟';">🔊 اسمعي إكرام</button>
        <div class="chat-box" id="chat">
            اضغطي على الزر أعلاه لتبدأ المحادثة...
        </div>
    </div>
</body>
</html>
